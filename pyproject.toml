[project]
name = "plicata"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dynamixel-sdk>=4.1.0",
    "ezdxf>=1.4.4",
    "ipycanvas>=0.14.3",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "serial-device",
    "shapely>=2.1.2",
]

[tool.uv.sources]
serial-device = { git = "https://github.com/daan/serial_device" }

[project.scripts]
plicata = "plicata.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
